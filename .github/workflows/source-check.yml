name: Source and API check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: firststep
          POSTGRES_USER: firststep
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firststep -d firststep"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/firststep
      DATABASE_USERNAME: firststep
      DATABASE_PASSWORD: ci-only-not-a-secret
      AI_ENABLED: 'false'
      AI_DATA_MODE: synthetic
      MAP_ROUTING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build and test server with a fresh database
        working-directory: server
        run: bash ./mvnw -B verify
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Prepare licensed assets and avatar bundle
        working-directory: mobile
        run: npm run avatar:build
      - name: Type-check mobile and test voice cancellation
        working-directory: mobile
        run: |
          npm run typecheck
          npm test
      - name: Start packaged API and import public program
        run: |
          java -jar server/target/one_step_service-0.0.1-SNAPSHOT.jar --import.file=data/programs.json > /tmp/firststep-api.log 2>&1 &
          echo $! > /tmp/firststep-api.pid
          python - <<'PY'
          import json,time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/api/v1/capabilities',timeout=2) as r:
                      capabilities=json.load(r)
                  assert capabilities['syntheticOnly'] is True
                  with urllib.request.urlopen('http://127.0.0.1:8080/api/v1/programs',timeout=2) as r:
                      programs=json.load(r)
                  assert isinstance(programs['items'],list)
                  print('Fresh runner API and public program import passed; no provider keys used.')
                  break
              except Exception:
                  if attempt==29:raise
                  time.sleep(1)
          PY
      - name: Stop test API
        if: always()
        run: |
          if [ -f /tmp/firststep-api.pid ]; then kill "$(cat /tmp/firststep-api.pid)" || true; fi
